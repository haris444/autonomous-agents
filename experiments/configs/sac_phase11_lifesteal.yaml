experiment:
  name: "sac_phase11_lifesteal"
  description: "SAC phase11 with lifesteal (25% HP on hit), resumed from enemy_kill_status_2 ep1000"

# Environment
grid_size: 8
n_agents: 8
max_hp: 100.0
hp_decay_rate: 0.01
attack_damage_fraction: 0.125
lifesteal_fraction: 0.25
max_steps_per_episode: 128

# Action space
n_directions: 5
n_action_types: 5

# Entity tokens
max_food_tokens: 16
fourier_bands: 4

# Attention
attention_embed_dim: 64
attention_num_heads: 4
group_embed_dim: 16

# Food
poor_food_value: 10.0
rich_food_value: 30.0
poor_food_spawn_rate: 0.000336
rich_food_spawn_rate: 0.0084
food_coverage_cap: 0.40

# Rewards
r_small: 10.0
r_large: 20.0
r_attack_mult: 0.1
r_damage_taken: -1.0
r_low_hp: 0.0
r_food_share: 0.0
r_betrayal: 0.0
r_reciprocity: 0.0
r_defense: 0.0
r_revenge: 0.5
r_survival: 0.0
r_death: 0.0
r_coop_attempt: 2.0
r_approach_food: 0.1
r_ally_proximity: 0.0

# Social hierarchy — enemy kills weighted 2x
r_hierarchy: 0.25                     # 25x increase from 0.01
hierarchy_food_weight: 1.0
hierarchy_damage_weight: 1.0
hierarchy_hp_weight: 1.0
hierarchy_kill_weight: 2.0

# SAC Hyperparameters
sac_learning_rate: 0.001             # 3x higher LR for faster learning
sac_tau: 0.01                        # 2x faster target net updates
sac_alpha_init: 0.8
sac_auto_alpha: true
sac_target_entropy_scale: 0.1
sac_gamma: 0.95                      # look further ahead (was 0.9)
sac_buffer_size: 500000
sac_batch_size: 2048                 # 2x batch for more stable large-LR updates
sac_learning_starts: 50000
sac_update_frequency: 4              # 4 gradient steps per env step (doubled)
sac_target_update_interval: 1

# Training
total_timesteps: 20000000
seed: 42
n_envs: 8                            # 2x parallel envs for more diverse experience

# Pretraining
pretrain_mode: false
curriculum_enabled: false

# Predator
n_predators: 1
predator_hp_mult: 0.5
predator_damage: 10.0
predator_kill_reward: 5.0
predator_respawn_steps: 20

training:
  output_dir: sac_phase11_lifesteal
  # checkpoint: sac_phase11_enemy_kill_status_2/checkpoint_ep1000.pt
