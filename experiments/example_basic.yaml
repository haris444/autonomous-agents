experiment:
  name: "basic_coop_test"
  description: "Test cooperation with default rewards"

n_agents: 8
grid_size: 15
r_coop_attempt: 5.0

# Social hierarchy
r_hierarchy: 1
hierarchy_food_weight: 1.0
hierarchy_damage_weight: 1.0
hierarchy_hp_weight: 1.0

total_timesteps: 500_000

# Predator
n_predators: 1
predator_hp_mult: 0.5
predator_damage: 10.0
predator_kill_reward: 5.0
predator_respawn_steps: 20

training:
  pretrain: true
  start_phase: 1
